services:
  avws-db:
    image: sogis/postgis:17-3.6
    container_name: avws-db
    environment:
      POSTGRES_DB: avws
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "-c include_dir=/opt/postgresql/conf.d/"
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - type: volume
        source: pgdata_avws
        target: /var/lib/postgresql/data
      - type: bind
        source: ./docker-compose/initdb.sh
        target: /docker-entrypoint-initdb.d/initdb.sh
      - type: bind
        source: ./docker-compose/initdb.sql
        target: /docker-entrypoint-initdb.d/initdb.sql
      - type: bind
        source: ./docker-compose/postgresql-custom.conf
        target: /opt/postgresql/conf.d/postgresql-custom.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avws"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  av-web-service:
    image: sogis/av-web-service:latest
    container_name: av-web-service
    depends_on:
      avws-db:
        condition: service_healthy
    environment:
      DBURL: jdbc:postgresql://avws-db:5432/avws
      DBUSR: postgres
      DBPWD: secret
      DBSCHEMA: stage

      # optional, falls die App ein Schema erwartet
      # AVWS_DBSCHEMA: avtest
      # JAVA_OPTS: "-Xmx1g"
    ports:
      # temporär exponiert
      - "8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    container_name: avws-caddy
    depends_on:
      - av-web-service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata_avws:
  caddy_data:
  caddy_config: